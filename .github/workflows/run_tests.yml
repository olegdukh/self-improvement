name: On-Demand Integration Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'target_code.py'

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hetzner CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xvz
          sudo mv hcloud /usr/local/bin/

      - name: Deploy VPS
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_PAT: ${{ secrets.PAT_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          chmod +x scripts/deploy_vps.sh
          ./scripts/deploy_vps.sh

      # Цей крок буде чекати на раннер, але ви можете додати логіку очікування/таймауту

      - name: Cleanup VPS
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          # Find the last created server by name or label and delete it
          SERVER_ID=$(hcloud server list -o json | jq -r '.[0].id')
          if [ ! -z "$SERVER_ID" ]; then
            hcloud server delete "$SERVER_ID"
          fi