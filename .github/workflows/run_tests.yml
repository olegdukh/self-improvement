name: On-Demand Integration Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'target_code.py'

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hetzner CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xvz
          sudo mv hcloud /usr/local/bin/

      - name: Deploy VPS and Run Tests
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_PAT: ${{ secrets.PAT_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          chmod +x scripts/deploy_vps.sh
          ./scripts/deploy_vps.sh
          
          echo "wait for runner to connect..."
          for i in {1..60}; do
            STATUS=$(curl -s -H "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/actions/runners" | jq -r '.runners[0].status // "offline"')
            if [ "$STATUS" == "online" ]; then
              echo "Runner connected!"
              break
            fi
            sleep 10
          done
          
          echo "wait for runner to finish..."
          while true; do
            COUNT=$(curl -s -H "Authorization: token $GH_PAT" \
              "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/actions/runners" | jq '.runners | length')
            if [ "$COUNT" -eq "0" ]; then 
              echo "Runner finished and destroyed itself."
              break 
            fi
            sleep 10
          done

      - name: Cleanup VPS
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          SERVERS=$(hcloud server list -o json | jq -r '.[] | select(.name | startswith("gh-runner-")) | .id')
          for server_id in $SERVERS; do
            echo "Deleting server: $server_id"
            hcloud server delete "$server_id"
          done